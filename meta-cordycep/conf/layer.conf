# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cordycep"
BBFILE_PATTERN_cordycep = "^${LAYERDIR}/"
BBFILE_PRIORITY_cordycep = "10"

LAYERDEPENDS_cordycep = "core"
LAYERSERIES_COMPAT_cordycep = "scarthgap"
